name: Update independent Forgejo F-Droid channel

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: forgejo-fdroid-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch independent Forgejo source and deployment
        run: |
          git clone --depth 1 --branch main https://git.dreamscape.one/execd/fdroid.git source
          git clone --depth 1 --branch site https://git.dreamscape.one/execd/fdroid.git public
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned repository tools
        run: |
          python -m pip install --require-hashes -r source/requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0"
      - name: Verify publisher policy boundaries
        working-directory: source
        run: python -m unittest -v
      - name: Build from Forgejo releases with independent signer
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_FORGEJO_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_FORGEJO_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_FORGEJO_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export FDROID_KEYSTORE="$RUNNER_TEMP/fdroid-forgejo.p12"
          trap 'rm -f "$FDROID_KEYSTORE"' EXIT
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > "$FDROID_KEYSTORE"
          unset FDROID_KEYSTORE_BASE64
          python source/update.py --source-type forgejo \
            --source-url https://git.dreamscape.one/execd/KernelSU-Tailscaled \
            --repo-url https://git.dreamscape.one/execd/fdroid/raw/branch/site/repo \
            --output "$RUNNER_TEMP/forgejo-site"
      - name: Publish only generated public files to Forgejo
        env:
          FJ_PUBLISH_TOKEN: ${{ secrets.FORGEJO_FDROID_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FJ_PUBLISH_TOKEN"
          export GIT_ASKPASS="$RUNNER_TEMP/forgejo-askpass"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' execd ;;
            *) printf '%s\n' "$FJ_PUBLISH_TOKEN" ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          rsync -r --delete --exclude=.git/ "$RUNNER_TEMP/forgejo-site/" public/
          git -C public add --all
          if ! git -C public diff --cached --quiet; then
            git -C public -c user.name=fdroid-publisher \
              -c user.email=fdroid@dreamscape.one commit -m 'Publish verified stable companion repository'
            git -C public push origin site
          fi
