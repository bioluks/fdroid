name: Publish stable F-Droid repository

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'FIRST publication only: allow absent prior repository'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - update.py
      - test_update.py
      - config.template.yml
      - metadata/**
      - approved-releases.json
      - requirements.in
      - requirements.txt
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: github-fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out independent repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install hash-pinned repository tools
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install APK signature verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0"'
      - name: Test updater policy boundaries
        run: python -m unittest -v
      - name: Build signed stable-only public repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export FDROID_KEYSTORE="$RUNNER_TEMP/fdroid-github.p12"
          trap 'rm -f "$FDROID_KEYSTORE"' EXIT
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > "$FDROID_KEYSTORE"
          unset FDROID_KEYSTORE_BASE64
          args=()
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          python update.py --output "$GITHUB_WORKSPACE/_site" "${args[@]}"
      - name: Upload public Pages artifact only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy signed repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
